<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="container">

        <h1>AI Resume Analyzer</h1>

        <p class="subtitle">
            Upload your resume and get AI-powered feedback
        </p>

        <div class="upload-section">
            <input type="file" id="resumeFile" accept=".pdf,.docx,.txt">

            <button id="analyzeBtn" type="button">
                Analyze Resume
            </button>
        </div>

        <div id="resultBox" aria-live="polite">
            <p>Your analysis will appear here...</p>
        </div>

        <button id="downloadBtn" type="button">
            Download Report
        </button>

    </div>

    <!-- Third-party libraries (globals: pdfjsLib, mammoth) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>

    <script type="module" src="js/main.js"></script>
</body>
</html>
